name: Gradle 构建

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: 添加执行权限
        run: chmod +x gradlew
      
      - name: 构建模组
        run: ./gradlew clean build --no-daemon --stacktrace
      
      # 列出所有构建产物，方便调试
      - name: 列出构建产物
        run: |
          echo "=== build/libs/ ==="
          ls -la build/libs/ || echo "目录不存在"
          echo "=== build/reports/ ==="
          ls -la build/reports/ || echo "目录不存在"
      
      # 上传模组 JAR
      - name: 上传模组 JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
      
      # 如果有调试报告，也上传
      - name: 上传测试报告（可选）
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: warn
