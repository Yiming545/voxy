yaml name=.github/workflows/gradle.yml url=https://github.com/JohnSnow14284/voxy/blob/mc_1211/.github/workflows/gradle.yml
name: Gradle 构建

on:
  push:
    branches:
      - main
      - master
      - mc_1211    # 新增此行，支持你的开发分支
  pull_request:
    branches:
      - main
      - master     # 如需要也支持 mc_1211 PR，请加 - mc_1211
      - mc_1211
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: 添加执行权限
        run: chmod +x gradlew
      
      - name: 构建模组
        run: ./gradlew clean build --no-daemon --stacktrace
      
      - name: 上传 JAR 文件
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
