name: Gradle 构建

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      
      - name: 验证 Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "错误: gradlew 文件不存在"
            exit 1
          fi
          chmod +x gradlew
      
      - name: 查看 Gradle 版本
        run: ./gradlew --version
      
      - name: 构建模组
        run: ./gradlew clean build --no-daemon --stacktrace
      
      - name: 列出构建产物
        run: ls -la build/libs/
      
      - name: 上传 JAR 文件
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
